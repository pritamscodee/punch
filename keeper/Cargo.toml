[package]
name = "keeper"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.1"
bs58 = "0.5.1"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
solana-hash = "4.7.0"
solana-instruction = "4.0.0"
solana-keypair = "4.0.0"
solana-message = { version = "5.1.0", features = ["wincode"] }
solana-pubkey = { version = "4.4.0", features = ["curve25519"] }
solana-signer = "4.0.0"
solana-transaction = { version = "5.1.0", features = ["wincode"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "json"] }
tokio = { version = "1.53.2", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
